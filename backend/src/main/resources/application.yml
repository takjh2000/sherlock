spring:
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
---
# 운영 프로필: 접속 정보는 환경변수로만 주입한다.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
