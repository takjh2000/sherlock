name: 'Gemini Review'

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@gemini-cli /review') &&
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      MAX_ROUNDS: 3
      HOST: takjh2000
    steps:
      - name: Checkout (PR 브랜치)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || '' }}
          fetch-depth: 0
          persist-credentials: false

      # ── 1. Gemini 리뷰 ──────────────────────────────
      - name: Gemini 리뷰
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
        run: |
          gh pr diff "$PR" | head -n 3000 > diff.txt
          touch CLAUDE.md GEMINI.md
          jq -n --rawfile guide GEMINI.md --rawfile rules CLAUDE.md --rawfile diff diff.txt '{
            systemInstruction: { parts: [ { text: ($guide + "\n\n# 프로젝트 규칙 (CLAUDE.md)\n" + $rules) } ] },
            contents: [ { role: "user", parts: [ { text:
              ("아래 Pull Request의 변경 내용(diff)을 GEMINI.md의 기준에 따라 리뷰해줘. 마크다운으로 작성하고, 반드시 마지막 줄에 `결론: 머지 가능` 또는 `결론: 수정 필요` 중 하나를 써.\n\n" + $diff)
            } ] } ],
            generationConfig: { maxOutputTokens: 16384 }
          }' > /tmp/req.json

          # 서버 과부하(503/500)는 최대 4번까지 간격을 늘려 재시도
          for i in 1 2 3 4; do
            curl -sS -H "x-goog-api-key: $GEMINI_API_KEY" -H "Content-Type: application/json" \
              "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent" \
              -d @/tmp/req.json > /tmp/res.json
            CODE=$(jq -r '.error.code // 0' /tmp/res.json)
            if [ "$CODE" != "503" ] && [ "$CODE" != "500" ]; then break; fi
            echo "Gemini 일시 오류(${CODE}), $((i*30))초 후 재시도 (${i}/4)"
            sleep $((i*30))
          done

          jq -r '.candidates[0].content.parts // [] | map(select(.thought != true) | .text // "") | join("")' /tmp/res.json > /tmp/review.md

          # 빈 리뷰 / 결론 없는 리뷰는 실패 처리 (잘못된 "머지 가능" 판정 방지)
          if ! grep -q "결론:" /tmp/review.md; then
            REASON=$(jq -r '.candidates[0].finishReason // .error.message // "알 수 없음"' /tmp/res.json)
            gh pr comment "$PR" --body "⚠️ Gemini 리뷰 생성에 실패했습니다 (사유: ${REASON}). @${HOST} \`@gemini-cli /review\`로 다시 실행해 주세요."
            echo "::error::리뷰에 결론이 없습니다. 원본 응답:"; cat /tmp/res.json
            exit 1
          fi

          { echo "## 🔎 Gemini 리뷰 (\`${MODEL}\`)"; echo; cat /tmp/review.md; } > /tmp/body.md
          gh pr comment "$PR" --body-file /tmp/body.md

          ROUND=$(gh pr view "$PR" --json comments --jq '[.comments[] | select(.body | startswith("## 🔎 Gemini 리뷰"))] | length')
          echo "round=$ROUND" >> "$GITHUB_OUTPUT"
          if grep "결론:" /tmp/review.md | tail -n 1 | grep -q "수정 필요"; then
            echo "need_fix=true" >> "$GITHUB_OUTPUT"
          else
            echo "need_fix=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 2. 결과에 따라 분기 ──────────────────────────
      - name: 머지 가능 → Gemini가 Approve
        if: steps.review.outputs.need_fix == 'false'
        run: |
          gh pr review "$PR" --approve --body "✅ Gemini 리뷰 결과 머지 가능입니다. @${HOST} CI 확인 후 머지해 주세요." \
            || gh pr comment "$PR" --body "✅ Gemini 리뷰 결과 머지 가능입니다. (자동 승인 실패: Actions 승인 권한 설정을 확인하세요) @${HOST}"

      - name: 반복 한도 초과 → 호스트 호출
        if: steps.review.outputs.need_fix == 'true' && fromJSON(steps.review.outputs.round) > fromJSON(env.MAX_ROUNDS)
        run: |
          gh pr edit "$PR" --add-label needs-human
          gh pr comment "$PR" --body "🙋 자동 리뷰-수정이 ${MAX_ROUNDS}회를 넘었습니다. @${HOST} 판단이 필요합니다."

      - name: Java 21 설치
        if: github.event_name == 'pull_request' && steps.review.outputs.need_fix == 'true' && fromJSON(steps.review.outputs.round) <= fromJSON(env.MAX_ROUNDS)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node 설치
        if: github.event_name == 'pull_request' && steps.review.outputs.need_fix == 'true' && fromJSON(steps.review.outputs.round) <= fromJSON(env.MAX_ROUNDS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 3. Claude가 리뷰 반영 ────────────────────────
      - name: Claude 자동 반영
        if: github.event_name == 'pull_request' && steps.review.outputs.need_fix == 'true' && fromJSON(steps.review.outputs.round) <= fromJSON(env.MAX_ROUNDS)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            너는 PR #${{ env.PR }}의 작성자다. 방금 Gemini가 남긴 리뷰가 /tmp/review.md 에 있다.
            (자동 리뷰 루프 ${{ steps.review.outputs.round }}/${{ env.MAX_ROUNDS }}회차)
            CLAUDE.md의 규칙에 따라 다음을 수행해라.

            1. 각 지적을 검토한다. Gemini는 학습 시점 이후 정보(라이브러리 버전, 모델명 등)를 몰라 오판할 수 있다.
               의심되면 실제로 빌드/테스트를 돌려 확인한다. (backend: ./gradlew test, frontend: npm ci && npm test -- --run)
            2. 타당한 지적만 코드에 반영하고, 테스트 통과를 확인한 뒤 현재 브랜치에 커밋하고 push한다.
            3. 반영하지 않은 지적은 기술적 근거를 정리해 `gh pr comment ${{ env.PR }}`로 남긴다.
            4. 반영할 코드가 하나도 없거나, 호스트의 결정이 필요한 사항이 있으면 코드를 바꾸지 말고
               근거/질문을 코멘트로 남긴 뒤 `gh pr edit ${{ env.PR }} --add-label needs-human` 을 실행한다.
            5. 이슈 범위를 벗어난 기능 추가는 하지 않는다. main 브랜치에는 절대 push하지 않는다.
          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(./gradlew:*),Bash(npm:*),Bash(npx:*),Bash(git:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(gh pr view:*),Bash(cat:*),Bash(ls:*),Bash(chmod:*)"
        env:
          GH_TOKEN: ${{ github.token }}
